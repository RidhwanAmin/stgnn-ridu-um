  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-start="0" data-duration="549.67" data-layout-allow-caption-zone>
    <div class="cg" id="cap0"><span>This walkthrough presents a PhD proposal</span></div>
    <div class="cg" id="cap1"><span>from Universiti Malaya:</span></div>
    <div class="cg" id="cap2"><span>estimating atrial ectopy from smartwatch beat</span></div>
    <div class="cg" id="cap3"><span>intervals after stroke.</span></div>
    <div class="cg" id="cap4"><span>Excessive supraventricular ectopic activity,</span></div>
    <div class="cg" id="cap5"><span>or ESVEA, helps</span></div>
    <div class="cg" id="cap6"><span>decide which stroke survivors get prolonged</span></div>
    <div class="cg" id="cap7"><span>rhythm monitoring. But every ESVEA threshold</span></div>
    <div class="cg" id="cap8"><span>was derived on Holter ECG,</span></div>
    <div class="cg" id="cap9"><span>the very resource being rationed.</span></div>
    <div class="cg" id="cap10"><span>Smartwatches report beat-to-beat intervals with a</span></div>
    <div class="cg" id="cap11"><span>per-beat quality flag,</span></div>
    <div class="cg" id="cap12"><span>yet nobody knows the error</span></div>
    <div class="cg" id="cap13"><span>of a daily ectopic count built</span></div>
    <div class="cg" id="cap14"><span>from them. Two problems stand out.</span></div>
    <div class="cg" id="cap15"><span>Filtering removes ectopic beats preferentially,</span></div>
    <div class="cg" id="cap16"><span>and the data a watch keeps</span></div>
    <div class="cg" id="cap17"><span>are weighted towards the night,</span></div>
    <div class="cg" id="cap18"><span>while premature atrial contractions,</span></div>
    <div class="cg" id="cap19"><span>or PACs, peak in the afternoon</span></div>
    <div class="cg" id="cap20"><span>and evening.</span></div>
    <div class="cg" id="cap21"><span>The study asks four questions.</span></div>
    <div class="cg" id="cap22"><span>First, how much ectopy information</span></div>
    <div class="cg" id="cap23"><span>is lost when a pulse waveform</span></div>
    <div class="cg" id="cap24"><span>becomes a quality-filtered interval series.</span></div>
    <div class="cg" id="cap25"><span>Second, whether a two-scale spatio-temporal graph</span></div>
    <div class="cg" id="cap26"><span>neural network, using the quality flag</span></div>
    <div class="cg" id="cap27"><span>as input, estimates the ectopy rate</span></div>
    <div class="cg" id="cap28"><span>better than non-graph baselines.</span></div>
    <div class="cg" id="cap29"><span>Third, whether a seven-day smartwatch protocol</span></div>
    <div class="cg" id="cap30"><span>after stroke yields enough usable data.</span></div>
    <div class="cg" id="cap31"><span>And fourth, whether substituting</span></div>
    <div class="cg" id="cap32"><span>the smartwatch estimate for the ECG</span></div>
    <div class="cg" id="cap33"><span>count changes ESVEA classification.</span></div>
    <div class="cg" id="cap34"><span>The primary definition of ESVEA is</span></div>
    <div class="cg" id="cap35"><span>four hundred and eighty or more</span></div>
    <div class="cg" id="cap36"><span>supraventricular beats per day.</span></div>
    <div class="cg" id="cap37"><span>The four objectives form a dependency</span></div>
    <div class="cg" id="cap38"><span>chain. Icentia11k, a large ECG dataset</span></div>
    <div class="cg" id="cap39"><span>with beat labels,</span></div>
    <div class="cg" id="cap40"><span>supplies truth for the information-loss analysis,</span></div>
    <div class="cg" id="cap41"><span>for model training,</span></div>
    <div class="cg" id="cap42"><span>and for a held-out substitution test.</span></div>
    <div class="cg" id="cap43"><span>Pulsewatch, which pairs wrist pulse signals,</span></div>
    <div class="cg" id="cap44"><span>motion and reference ECG,</span></div>
    <div class="cg" id="cap45"><span>supplies the motion term of the</span></div>
    <div class="cg" id="cap46"><span>retention model. The Garmin specification fixes</span></div>
    <div class="cg" id="cap47"><span>how flags and</span></div>
    <div class="cg" id="cap48"><span>gaps behave. Objective one feeds the</span></div>
    <div class="cg" id="cap49"><span>model design, the frozen model feeds</span></div>
    <div class="cg" id="cap50"><span>the substitution test,</span></div>
    <div class="cg" id="cap51"><span>and the stroke cohort feeds deployability</span></div>
    <div class="cg" id="cap52"><span>and the real-world coverage profile.</span></div>
    <div class="cg" id="cap53"><span>If the cohort cannot start in</span></div>
    <div class="cg" id="cap54"><span>time, objectives one,</span></div>
    <div class="cg" id="cap55"><span>two and four still proceed.</span></div>
    <div class="cg" id="cap56"><span>Objective one starts with</span></div>
    <div class="cg" id="cap57"><span>filtering. A common rule rejects any</span></div>
    <div class="cg" id="cap58"><span>interval that deviates from the median</span></div>
    <div class="cg" id="cap59"><span>of the five preceding accepted intervals</span></div>
    <div class="cg" id="cap60"><span>by more than a threshold,</span></div>
    <div class="cg" id="cap61"><span>usually twenty percent.</span></div>
    <div class="cg" id="cap62"><span>A premature beat is short</span></div>
    <div class="cg" id="cap63"><span>by definition, and its pause is</span></div>
    <div class="cg" id="cap64"><span>long, so both are rejected.</span></div>
    <div class="cg" id="cap65"><span>In this illustrative series you can</span></div>
    <div class="cg" id="cap66"><span>see the band around</span></div>
    <div class="cg" id="cap67"><span>the running reference and the crosses</span></div>
    <div class="cg" id="cap68"><span>on rejected intervals.</span></div>
    <div class="cg" id="cap69"><span>On two hundred and ninety-eight Icentia11k</span></div>
    <div class="cg" id="cap70"><span>patients, the effect is large.</span></div>
    <div class="cg" id="cap71"><span>At the common twenty percent threshold,</span></div>
    <div class="cg" id="cap72"><span>the filter removed sixty-one percent of</span></div>
    <div class="cg" id="cap73"><span>PAC coupling intervals but only nine</span></div>
    <div class="cg" id="cap74"><span>percent of normal intervals.</span></div>
    <div class="cg" id="cap75"><span>And the loss depends on burden:</span></div>
    <div class="cg" id="cap76"><span>patients with ESVEA lose a smaller</span></div>
    <div class="cg" id="cap77"><span>share of their PAC intervals</span></div>
    <div class="cg" id="cap78"><span>than patients without it,</span></div>
    <div class="cg" id="cap79"><span>probably because frequent PACs enter the</span></div>
    <div class="cg" id="cap80"><span>running reference and are then accepted.</span></div>
    <div class="cg" id="cap81"><span>So a single correction factor is</span></div>
    <div class="cg" id="cap82"><span>unlikely to restore the count.</span></div>
    <div class="cg" id="cap83"><span>Hypothesis one tests this at patient</span></div>
    <div class="cg" id="cap84"><span>level, in new patients.</span></div>
    <div class="cg" id="cap85"><span>Objective two builds the estimator.</span></div>
    <div class="cg" id="cap86"><span>The model works at two scales.</span></div>
    <div class="cg" id="cap87"><span>At the beat scale,</span></div>
    <div class="cg" id="cap88"><span>the stream of reported beats is</span></div>
    <div class="cg" id="cap89"><span>cut into windows of N beats,</span></div>
    <div class="cg" id="cap90"><span>so a gap shortens the</span></div>
    <div class="cg" id="cap91"><span>day rather than creating</span></div>
    <div class="cg" id="cap92"><span>empty windows. An attention readout</span></div>
    <div class="cg" id="cap93"><span>pools each window into one embedding,</span></div>
    <div class="cg" id="cap94"><span>giving more weight to informative</span></div>
    <div class="cg" id="cap95"><span>beats such as</span></div>
    <div class="cg" id="cap96"><span>a PAC and its pause.</span></div>
    <div class="cg" id="cap97"><span>At the epoch scale,</span></div>
    <div class="cg" id="cap98"><span>the window embeddings form a graph</span></div>
    <div class="cg" id="cap99"><span>across the day,</span></div>
    <div class="cg" id="cap100"><span>processed by graph convolution</span></div>
    <div class="cg" id="cap101"><span>and a selective state-space layer.</span></div>
    <div class="cg" id="cap102"><span>Because Icentia11k segments have no clock</span></div>
    <div class="cg" id="cap103"><span>time, training uses pseudo-days built from</span></div>
    <div class="cg" id="cap104"><span>one patient&#x27;s segments.</span></div>
    <div class="cg" id="cap105"><span>Inside each window there are two</span></div>
    <div class="cg" id="cap106"><span>graphs. The temporal chain links each</span></div>
    <div class="cg" id="cap107"><span>beat to its neighbours in time,</span></div>
    <div class="cg" id="cap108"><span>capturing the short-then-long signature of a</span></div>
    <div class="cg" id="cap109"><span>premature beat. The similarity graph links</span></div>
    <div class="cg" id="cap110"><span>each beat to its k nearest</span></div>
    <div class="cg" id="cap111"><span>neighbours in feature space,</span></div>
    <div class="cg" id="cap112"><span>so recurring PACs share evidence wherever</span></div>
    <div class="cg" id="cap113"><span>they occur. Both graphs are built</span></div>
    <div class="cg" id="cap114"><span>once per window and reused in</span></div>
    <div class="cg" id="cap115"><span>every layer.</span></div>
    <div class="cg" id="cap116"><span>One local layer sums</span></div>
    <div class="cg" id="cap117"><span>three branches: the chain neighbours scaled</span></div>
    <div class="cg" id="cap118"><span>by a learned gate</span></div>
    <div class="cg" id="cap119"><span>alpha, the beat&#x27;s own features,</span></div>
    <div class="cg" id="cap120"><span>and the similarity neighbours scaled by</span></div>
    <div class="cg" id="cap121"><span>a learned gate beta.</span></div>
    <div class="cg" id="cap122"><span>The sum is normalised and</span></div>
    <div class="cg" id="cap123"><span>passed through a ReLU.</span></div>
    <div class="cg" id="cap124"><span>The self branch keeps a single</span></div>
    <div class="cg" id="cap125"><span>premature beat from</span></div>
    <div class="cg" id="cap126"><span>being averaged away,</span></div>
    <div class="cg" id="cap127"><span>and because alpha and beta are</span></div>
    <div class="cg" id="cap128"><span>reported, the weight</span></div>
    <div class="cg" id="cap129"><span>given to each kind of evidence</span></div>
    <div class="cg" id="cap130"><span>can be inspected.</span></div>
    <div class="cg" id="cap131"><span>Every component is then tested</span></div>
    <div class="cg" id="cap132"><span>against simpler alternatives by ablation.</span></div>
    <div class="cg" id="cap133"><span>The Garmin quality</span></div>
    <div class="cg" id="cap134"><span>flag marks both motion-affected beats and</span></div>
    <div class="cg" id="cap135"><span>any interval it judges abnormally short</span></div>
    <div class="cg" id="cap136"><span>or long, so a premature beat</span></div>
    <div class="cg" id="cap137"><span>tends to be flagged.</span></div>
    <div class="cg" id="cap138"><span>Deleting flagged beats would delete the</span></div>
    <div class="cg" id="cap139"><span>very events being counted.</span></div>
    <div class="cg" id="cap140"><span>Instead, the flag enters the model</span></div>
    <div class="cg" id="cap141"><span>as an input.</span></div>
    <div class="cg" id="cap142"><span>Each kind of loss then goes</span></div>
    <div class="cg" id="cap143"><span>to one place:</span></div>
    <div class="cg" id="cap144"><span>flagged beats stay as input,</span></div>
    <div class="cg" id="cap145"><span>marked gaps go to observed time,</span></div>
    <div class="cg" id="cap146"><span>beats silently missed at motion are</span></div>
    <div class="cg" id="cap147"><span>corrected by inverse retention weighting,</span></div>
    <div class="cg" id="cap148"><span>and a premature beat with no</span></div>
    <div class="cg" id="cap149"><span>wrist pulse cannot be corrected and</span></div>
    <div class="cg" id="cap150"><span>is measured instead.</span></div>
    <div class="cg" id="cap151"><span>Equation 3.1 defines retention,</span></div>
    <div class="cg" id="cap152"><span>pi hat of m:</span></div>
    <div class="cg" id="cap153"><span>the probability that a beat outside</span></div>
    <div class="cg" id="cap154"><span>a gap is reported at motion</span></div>
    <div class="cg" id="cap155"><span>level m, fitted</span></div>
    <div class="cg" id="cap156"><span>on Pulsewatch. Equation 3.2 turns calibrated</span></div>
    <div class="cg" id="cap157"><span>beat probabilities into a daily</span></div>
    <div class="cg" id="cap158"><span>rate. Each reported beat is weighted</span></div>
    <div class="cg" id="cap159"><span>by one over its</span></div>
    <div class="cg" id="cap160"><span>retention, each six-hour block is divided</span></div>
    <div class="cg" id="cap161"><span>by its own observed</span></div>
    <div class="cg" id="cap162"><span>hours, and the four blocks are</span></div>
    <div class="cg" id="cap163"><span>combined by length,</span></div>
    <div class="cg" id="cap164"><span>so a night-heavy recording no longer</span></div>
    <div class="cg" id="cap165"><span>biases the day.</span></div>
    <div class="cg" id="cap166"><span>This revised form of Equation 3.1</span></div>
    <div class="cg" id="cap167"><span>awaits supervisor confirmation.</span></div>
    <div class="cg" id="cap168"><span>This worked example uses illustrative numbers.</span></div>
    <div class="cg" id="cap169"><span>Most observed time falls at night</span></div>
    <div class="cg" id="cap170"><span>and most ectopy in the afternoon</span></div>
    <div class="cg" id="cap171"><span>and evening. The naive count divides</span></div>
    <div class="cg" id="cap172"><span>all PACs by all observed hours.</span></div>
    <div class="cg" id="cap173"><span>Retention weighting raises it.</span></div>
    <div class="cg" id="cap174"><span>Block weighting then gives each six-hour</span></div>
    <div class="cg" id="cap175"><span>block a quarter of the day,</span></div>
    <div class="cg" id="cap176"><span>however few hours were observed in</span></div>
    <div class="cg" id="cap177"><span>it. Equation 3.3,</span></div>
    <div class="cg" id="cap178"><span>the coverage gate,</span></div>
    <div class="cg" id="cap179"><span>reports the daily value only if</span></div>
    <div class="cg" id="cap180"><span>every block reaches a minimum of</span></div>
    <div class="cg" id="cap181"><span>observed hours; otherwise the model abstains.</span></div>
    <div class="cg" id="cap182"><span>Over a week,</span></div>
    <div class="cg" id="cap183"><span>single days often abstain.</span></div>
    <div class="cg" id="cap184"><span>Here day two and day seven</span></div>
    <div class="cg" id="cap185"><span>fail the gate,</span></div>
    <div class="cg" id="cap186"><span>day five was</span></div>
    <div class="cg" id="cap187"><span>not worn, and day six clears</span></div>
    <div class="cg" id="cap188"><span>every block but fails the day</span></div>
    <div class="cg" id="cap189"><span>and night validity rule,</span></div>
    <div class="cg" id="cap190"><span>so it also abstains.</span></div>
    <div class="cg" id="cap191"><span>ESVEA status therefore uses Equation</span></div>
    <div class="cg" id="cap192"><span>3.4, which pools each</span></div>
    <div class="cg" id="cap193"><span>block across valid days.</span></div>
    <div class="cg" id="cap194"><span>In the simulation</span></div>
    <div class="cg" id="cap195"><span>in Appendix C,</span></div>
    <div class="cg" id="cap196"><span>under poor coverage,</span></div>
    <div class="cg" id="cap197"><span>pooling kept the count computable for</span></div>
    <div class="cg" id="cap198"><span>about eighty-eight percent of participants,</span></div>
    <div class="cg" id="cap199"><span>against about eighty-one percent for the</span></div>
    <div class="cg" id="cap200"><span>per-day rule, with lower misclassification.</span></div>
    <div class="cg" id="cap201"><span>Evaluation keeps patients</span></div>
    <div class="cg" id="cap202"><span>apart. Icentia11k is split into four</span></div>
    <div class="cg" id="cap203"><span>disjoint sets: P zero for the</span></div>
    <div class="cg" id="cap204"><span>preliminary analysis, P one for the</span></div>
    <div class="cg" id="cap205"><span>hypothesis one test,</span></div>
    <div class="cg" id="cap206"><span>P two for model development,</span></div>
    <div class="cg" id="cap207"><span>and P three,</span></div>
    <div class="cg" id="cap208"><span>held out untouched until the model</span></div>
    <div class="cg" id="cap209"><span>is frozen at milestone M4.</span></div>
    <div class="cg" id="cap210"><span>Hypothesis two is the single primary</span></div>
    <div class="cg" id="cap211"><span>contrast: the graph model against the</span></div>
    <div class="cg" id="cap212"><span>best non-graph baseline,</span></div>
    <div class="cg" id="cap213"><span>on the mean absolute error of</span></div>
    <div class="cg" id="cap214"><span>the daily-equivalent count,</span></div>
    <div class="cg" id="cap215"><span>with a paired subject-level bootstrap.</span></div>
    <div class="cg" id="cap216"><span>In objective four,</span></div>
    <div class="cg" id="cap217"><span>the held-out patients are</span></div>
    <div class="cg" id="cap218"><span>degraded with flags,</span></div>
    <div class="cg" id="cap219"><span>gaps, pulse deficit and timing noise,</span></div>
    <div class="cg" id="cap220"><span>and the frozen</span></div>
    <div class="cg" id="cap221"><span>model&#x27;s ESVEA calls are compared with</span></div>
    <div class="cg" id="cap222"><span>the ECG reference.</span></div>
    <div class="cg" id="cap223"><span>Objective three recruits about forty adults</span></div>
    <div class="cg" id="cap224"><span>after ischaemic stroke or TIA for</span></div>
    <div class="cg" id="cap225"><span>seven days of Garmin wear.</span></div>
    <div class="cg" id="cap226"><span>The primary outcome is the proportion</span></div>
    <div class="cg" id="cap227"><span>with at least three valid days,</span></div>
    <div class="cg" id="cap228"><span>with a traffic-light rule:</span></div>
    <div class="cg" id="cap229"><span>green at seventy-five percent or more,</span></div>
    <div class="cg" id="cap230"><span>red at fifty or below.</span></div>
    <div class="cg" id="cap231"><span>Device verification on non-participant wear comes</span></div>
    <div class="cg" id="cap232"><span>first, including twenty-four-hour interval logging,</span></div>
    <div class="cg" id="cap233"><span>which Garmin has so far</span></div>
    <div class="cg" id="cap234"><span>confirmed only by personal communication.</span></div>
    <div class="cg" id="cap235"><span>Preliminary evidence from a cross-device pilot</span></div>
    <div class="cg" id="cap236"><span>shows that the interval representation carries</span></div>
    <div class="cg" id="cap237"><span>rhythm information. Ranking transferred across devices,</span></div>
    <div class="cg" id="cap238"><span>with AUROC of 0.995 or higher</span></div>
    <div class="cg" id="cap239"><span>wherever non-AF windows existed.</span></div>
    <div class="cg" id="cap240"><span>But the operating point did not</span></div>
    <div class="cg" id="cap241"><span>transfer: AF recall fell to forty-five</span></div>
    <div class="cg" id="cap242"><span>percent on MIMIC-III fingertip signals.</span></div>
    <div class="cg" id="cap243"><span>Each external cohort has only one</span></div>
    <div class="cg" id="cap244"><span>AF subject, so these results show</span></div>
    <div class="cg" id="cap245"><span>feasibility, not accuracy.</span></div>
    <div class="cg" id="cap246"><span>These pilot values await supervisor confirmation.</span></div>
    <div class="cg" id="cap247"><span>To close, the</span></div>
    <div class="cg" id="cap248"><span>limits are stated plainly.</span></div>
    <div class="cg" id="cap249"><span>Error is characterised on ECG-labelled data</span></div>
    <div class="cg" id="cap250"><span>under simulated losses,</span></div>
    <div class="cg" id="cap251"><span>not on a real device.</span></div>
    <div class="cg" id="cap252"><span>Pulse deficit cannot be corrected by</span></div>
    <div class="cg" id="cap253"><span>weighting, so its bias is measured.</span></div>
    <div class="cg" id="cap254"><span>Transfer from Samsung to Garmin is</span></div>
    <div class="cg" id="cap255"><span>an assumption. The contribution</span></div>
    <div class="cg" id="cap256"><span>is the observation model:</span></div>
    <div class="cg" id="cap257"><span>the flag as evidence,</span></div>
    <div class="cg" id="cap258"><span>a frozen retention correction,</span></div>
    <div class="cg" id="cap259"><span>and a coverage gate that knows</span></div>
    <div class="cg" id="cap260"><span>when not to report.</span></div>
    <div class="cg" id="cap261"><span>The graph architecture is a means,</span></div>
    <div class="cg" id="cap262"><span>tested against baselines,</span></div>
    <div class="cg" id="cap263"><span>not the claim itself.</span></div>
  </div>
