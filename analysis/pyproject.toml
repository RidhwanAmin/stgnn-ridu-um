[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esvea"
version = "0.1.0"
description = "Track 1 analyses for the ESVEA smartwatch study: Icentia11k pipeline, RO1, estimator equations, training simulator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "pyarrow>=14", "wfdb>=4.1", "pyyaml>=6",
]

[project.optional-dependencies]
adaptive = ["neurokit2>=0.2.10"]
model = ["torch>=2.2", "torch_geometric>=2.5"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs PhysioNet access"]
